services:
  - type: web
    name: dinepixel-api
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
    autoDeploy: true
